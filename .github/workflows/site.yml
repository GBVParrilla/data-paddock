# Builds and publishes the static site to GitHub Pages.
#
#   daily (schedule)   full: fetch new sessions -> Claude writes their stories -> save DB -> publish
#   push to main       publish-only: upgrade derived data if needed, re-export with the latest code + story
#                      corrections (no Claude calls)
#   Every mode checks the export (tests/invariants) and crawls the built site before deploying.
#   manual (Actions tab -> "Run workflow") pick the mode, cap or force story writing
#
# The SQLite database lives as an asset on the "db-snapshot" release (created on first run), so the
# stories Claude writes are kept between runs and never regenerated unless their data changes.
#
# Claude access uses Workload Identity Federation: no API key is stored anywhere. The job asks GitHub
# for a short-lived OIDC token (id-token: write) and exchanges it for a short-lived Claude token, so
# only runs on this repo's main branch can call Claude (see README -> Publishing).
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions", and these repository variables
# (Settings -> Secrets and variables -> Actions -> Variables; they're IDs, not secrets):
# ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_SERVICE_ACCOUNT_ID,
# ANTHROPIC_WORKSPACE_ID (only if the rule covers more than one workspace).
# Optional: F1_YEAR (default 2026), MAX_NEW_STORIES (per-run cap on Claude calls, default 800),
# F1_NARRATIVE_MODEL (default claude-haiku-5-5), F1_NARRATIVE_EFFORT (default low).
name: Site

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: ["stories/**", "frontend/**", "f1tracker/**", "scripts/**", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = new data + stories; stories-only = write missing stories; publish-only = just rebuild the site"
        type: choice
        options: [full, stories-only, publish-only]
        default: full
      max_new_stories:
        description: "Cap on Claude calls this run (blank = repository default)"
        required: false
      force_stories:
        description: "Rewrite every story even if its data is unchanged (expensive)"
        type: boolean
        default: false
      story_rounds:
        description: "Only write stories for these rounds, e.g. 1,12,17 (the pilot set). Blank = all"
        required: false

permissions:
  contents: write # the db-snapshot release
  pages: write
  id-token: write # GitHub OIDC token: exchanged for Claude access, and used by the Pages deploy

concurrency:
  group: site
  cancel-in-progress: false # never cut off a run that is saving the database

env:
  F1_YEAR: ${{ vars.F1_YEAR || '2026' }}
  MODE: ${{ github.event_name == 'push' && 'publish-only' || inputs.mode || 'full' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-fund --no-audit

      - name: Restore database
        run: |
          mkdir -p data
          if gh release view db-snapshot >/dev/null 2>&1; then
            # a snapshot exists: failing to fetch it must stop the run (never overwrite it with a fresh DB)
            gh release download db-snapshot --pattern f1.db.gz --dir data --clobber
            gunzip -f data/f1.db.gz
            ls -lh data/f1.db
          else
            echo "No saved database yet - starting fresh."
          fi

      - name: Process data and write stories
        env:
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          F1_NARRATIVE_MODEL: ${{ vars.F1_NARRATIVE_MODEL }}
          F1_NARRATIVE_EFFORT: ${{ vars.F1_NARRATIVE_EFFORT }}
        run: |
          args="--year $F1_YEAR --time-budget-min 270 --max-new-stories ${{ inputs.max_new_stories || vars.MAX_NEW_STORIES || '800' }}"
          [ "$MODE" = "stories-only" ] && args="$args --no-ingest"
          # publish-only still upgrades derived data to this code's version (no Claude calls)
          [ "$MODE" = "publish-only" ] && args="$args --no-ingest --no-stories"
          [ "${{ inputs.force_stories }}" = "true" ] && args="$args --force-stories"
          [ -n "${{ inputs.story_rounds }}" ] && args="$args --story-rounds ${{ inputs.story_rounds }}"
          python scripts/run_pipeline.py $args

      - name: Save database
        if: always() && hashFiles('data/f1.db') != ''
        run: |
          python -c "import sqlite3; c = sqlite3.connect('data/f1.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('VACUUM'); c.close()"
          gzip -kf data/f1.db
          gh release view db-snapshot >/dev/null 2>&1 || gh release create db-snapshot --prerelease --title "Database snapshot" \
            --notes "Pipeline database (data + stored AI stories), updated by the Site workflow. Don't delete: stories would have to be regenerated."
          gh release upload db-snapshot data/f1.db.gz --clobber

      - name: Build site
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run build --prefix frontend

      - name: Export data
        run: python scripts/export_static.py --out frontend/dist/data

      - run: npx --prefix frontend playwright install --with-deps chromium

      - name: Page shells and preview images (path routing, docs/adr/0001)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: SITE_URL="https://${OWNER,,}.github.io/$REPO/" node frontend/scripts/prerender.mjs frontend/dist

      # Nothing deploys unless the published numbers hold together and the site survives a crawl.
      - name: Data invariants
        run: DATA_DIR=frontend/dist/data python -m pytest -q tests/invariants
      - name: Crawl the built site (desktop and mobile)
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npx playwright test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
