# Runs on every push and pull request: unit tests, lint and types, then the data invariants and the
# Playwright crawl against a production build made from the published database snapshot.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-24.04 # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests --ignore=tests/invariants
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-fund --no-audit
      - run: npm run lint --prefix frontend
      - run: npx --prefix frontend tsc -b frontend

  site:
    needs: code
    runs-on: ubuntu-24.04 # Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-fund --no-audit
      - name: Restore the published database
        run: |
          mkdir -p data
          curl -fsSL -o data/f1.db.gz "https://github.com/${{ github.repository }}/releases/download/db-snapshot/f1.db.gz"
          gunzip -f data/f1.db.gz
      - name: Bring it to this code's data version (no Claude calls)
        run: python scripts/run_pipeline.py --year ${{ vars.F1_YEAR || '2026' }} --no-ingest --no-stories
      - name: Build and export
        env:
          VITE_STATIC: "1"
          VITE_BASE: /data-paddock/
        run: |
          npm run build --prefix frontend
          python scripts/export_static.py --out frontend/dist/data
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Page shells (no preview images here)
        run: OG_IMAGES=0 node frontend/scripts/prerender.mjs frontend/dist
      - name: Data invariants
        run: DATA_DIR=frontend/dist/data python -m pytest -q tests/invariants
      - name: Crawl the site (desktop and mobile)
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crawl-results
          path: frontend/e2e-results
          retention-days: 7
